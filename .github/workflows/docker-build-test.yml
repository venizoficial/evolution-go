name: Build test Docker image

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate image (no push)
        run: docker build --pull --tag evolution-go:button-fix-test .
      - name: Export candidate image for isolated VPS testing
        run: docker save evolution-go:button-fix-test | gzip -1 > evolution-go-button-fix-test.tar.gz
      - name: Upload candidate image artifact
        uses: actions/upload-artifact@v4
        with:
          name: evolution-go-button-fix-test
          path: evolution-go-button-fix-test.tar.gz
          if-no-files-found: error
          retention-days: 7
