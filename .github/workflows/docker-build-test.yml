name: Build test Docker image

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate image (no push)
        run: docker build --pull --tag evolution-go:button-fix-test .
